<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منصة A9</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f766e'/><text x='50' y='66' font-size='46' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>A9</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="tb-side">
      <a href="#me" id="me-btn" class="me-btn" aria-label="حسابي" hidden></a>
    </div>
    <a href="#" class="brand">مجموعة A9</a>
    <div class="tb-side"></div>
  </header>

  <!-- تسجيل الدخول -->
  <main id="login" class="view page narrow" hidden>
    <div id="login-pick" class="card">
      <h1>تسجيل الدخول</h1>
      <p class="sub">اختار اسمك من القائمة</p>
      <input id="name-search" class="input" type="search" placeholder="دوّر على اسمك" autocomplete="off" />
      <div id="names" class="names"></div>
    </div>

    <form id="login-pin" class="card" hidden>
      <button type="button" class="back" id="pin-back">رجوع</button>
      <div id="pin-avatar" class="avatar big"></div>
      <h1 id="pin-name"></h1>
      <p class="sub" id="pin-hint"></p>
      <input id="pin1" class="input pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required />
      <div id="pin2-wrap" hidden>
        <p class="sub">اكتب الرقم مرة ثانية للتأكيد</p>
        <input id="pin2" class="input pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" />
      </div>
      <p id="pin-error" class="error" hidden></p>
      <button type="submit" class="btn" id="pin-submit">دخول</button>
    </form>
  </main>

  <!-- الرئيسية -->
  <main id="home" class="view page" hidden>
    <section class="hello">
      <p class="hello-date" id="hello-date"></p>
      <h1 id="hello-name"></h1>
    </section>
    <a href="#gyn" class="rot-card">
      <div class="rot-top">
        <span class="rot-title">روتة النسائية</span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div class="rot-next" id="rot-next"></div>
      <div class="bar light"><i id="rot-bar"></i></div>
      <div class="rot-count" id="rot-count"></div>
    </a>
  </main>

  <!-- روتة النسائية -->
  <main id="gyn" class="view page" hidden>
    <a href="#" class="back">رجوع</a>
    <h1>روتة النسائية والتوليد</h1>
    <p class="sub">جدول Group 3 &middot; وقت السشن 11:30 صباحاً</p>
    <section id="progress" class="progress"></section>
    <section id="next" class="next"></section>
    <h2>الجدول الكامل</h2>
    <div id="list" class="list"></div>
  </main>

  <!-- حسابي -->
  <main id="me" class="view page narrow" hidden>
    <a href="#" class="back">رجوع</a>
    <section class="card profile">
      <div class="profile-photo">
        <div id="me-avatar" class="avatar huge"></div>
        <label class="photo-btn" for="photo-input" aria-label="تغيير الصورة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </label>
        <input id="photo-input" type="file" accept="image/*" hidden />
      </div>
      <h1 id="me-name"></h1>
      <div id="me-badges" class="badges"></div>
      <div class="photo-actions">
        <label for="photo-input" class="link-btn">تغيير الصورة</label>
        <button type="button" id="photo-remove" class="link-btn danger" hidden>حذف الصورة</button>
      </div>
      <p id="photo-msg" class="note center-text" hidden></p>
    </section>

    <section class="card">
      <h2 class="card-title">معلومات الحساب</h2>
      <div class="info-row"><span>المجموعة</span><b>A9 &middot; Group 3</b></div>
      <div class="info-row"><span>آخر دخول</span><b id="me-last"></b></div>
    </section>

    <form id="pin-form" class="card">
      <h2 class="card-title">تغيير الرقم السري</h2>
      <input id="pin-old" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="الرقم الحالي" autocomplete="off" required />
      <input id="pin-new" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="الرقم الجديد (4 أرقام)" autocomplete="off" required />
      <input id="pin-new2" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="أعد الرقم الجديد" autocomplete="off" required />
      <p id="pin-msg" class="error" hidden></p>
      <button type="submit" class="btn">حفظ الرقم الجديد</button>
    </form>

    <a href="#admin" id="me-admin" class="card menu-row" hidden>
      <span>صفحة الإدارة</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </a>
    <button type="button" id="logout" class="btn outline-danger">تسجيل الخروج</button>
  </main>

  <!-- الإدارة -->
  <main id="admin" class="view page" hidden>
    <a href="#" class="back">رجوع</a>
    <h1>الإدارة</h1>
    <p class="sub" id="admin-summary"></p>
    <div class="bar"><i id="admin-bar"></i></div>
    <div style="height:16px"></div>
    <div id="admin-list" class="list"></div>
  </main>

  <div id="loading" class="loading" hidden>جاري التحميل</div>

  <script src="assets/config.js"></script>
  <script src="assets/gyn.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
