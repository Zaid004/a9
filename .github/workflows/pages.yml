name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset versions
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" index.html sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # أحياناً GitHub ما يلگى الملفات إذا النشر صار مباشرة بعد الرفع، فننطيه شوية وقت
      - name: Wait for the artifact to register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
